name: Pruebas Playwright Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Instalar Chromium y dependencias del sistema
        run: python -m playwright install --with-deps chromium

      - name: Ejecutar las pruebas
        run: python -m pytest

      - name: Guardar evidencias
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: evidencias-playwright-python
          path: |
            test-results/
            screenshots/
          retention-days: 14